name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipk:
    name: ipk (opkg)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check version consistency
        run: |
          mk=$(sed -n 's/^PKG_VERSION:=//p' luci-app-jxgm-drcom/Makefile)
          js=$(sed -n "s/.*var PKG_VERSION = '\([^']*\)'.*/\1/p" luci-app-jxgm-drcom/htdocs/luci-static/resources/view/drcom/overview.js)
          echo "Makefile=$mk overview.js=$js"
          [ -n "$mk" ] && [ "$mk" = "$js" ]

      - name: Check translations
        run: python3 tools/check-i18n.py

      - name: Build ipk
        run: |
          python3 tools/mkipk.py
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: package-ipk
          path: dist/*.ipk

  apk:
    name: apk (OpenWrt 25.12 SDK)
    runs-on: ubuntu-latest
    # Only tags need the heavy SDK job; branch pushes just validate the ipk so
    # the build badge stays green.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build apk with the official SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-25.12.0
          FEEDNAME: jxgmdrcom
          PACKAGES: luci-base luci-app-jxgm-drcom
          V: s

      - name: Collect apk
        run: |
          mkdir -p dist
          # 只取本包，构建依赖（luci-base/curl/jshn/...）不要带出去
          find bin/packages -name 'luci-app-jxgm-drcom-*.apk' -exec cp -v {} dist/ \;
          ls -l dist
          test -n "$(ls -A dist/*.apk 2>/dev/null)" || { echo "no apk produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: dist/*.apk

  release:
    name: release
    needs: [ ipk, apk ]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.ipk.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import re, sys

          tag = sys.argv[1].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[%s\].*?$(.*?)(?=^## \[|\Z)'
                        % re.escape(tag), text, re.S | re.M)

          if not m:
              sys.exit('no changelog section for %s' % tag)

          body = m.group(0).strip() + '\n'
          open('release-notes.md', 'w', encoding='utf-8').write(body)
          print(body)
          PY

      - name: Checksums
        run: |
          cd artifacts
          sha256sum ./*.ipk ./*.apk > sha256sums.txt 2>/dev/null || sha256sum ./*.ipk > sha256sums.txt
          cat sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/luci-app-*.ipk
            artifacts/luci-app-*.apk
            artifacts/sha256sums.txt
